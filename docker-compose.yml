# รันทั้งระบบ: docker compose up --build  แล้วเปิด http://localhost:3001
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
      POSTGRES_DB: claims
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://claims:${POSTGRES_PASSWORD:-claims}@db:5432/claims?sslmode=disable
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
